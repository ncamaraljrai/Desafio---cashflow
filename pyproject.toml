[project]
name = "cashflow-clean-architecture"
version = "1.0.0"
requires-python = ">=3.12"
description = "Cashflow challenge: independent ledger and daily consolidation"
dependencies = ["fastapi==0.143.0", "uvicorn==0.54.0", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
