name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install -r requirements-dev.lock
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
      - run: PYTHONPATH=. python scripts/verify_runtime.py --seconds 30
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: runtime-verification
          path: docs/verification-runtime.json
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/configure.py
      - run: docker compose --profile ai config --quiet
      - run: docker compose --profile ai up --build -d --wait
      - run: curl --fail --retry 10 --retry-delay 2 --retry-all-errors http://localhost:8000/health/ready
      - run: curl --fail --retry 10 --retry-delay 2 --retry-all-errors http://localhost:8001/health/ready
      - run: curl --fail --retry 10 --retry-delay 2 --retry-all-errors http://localhost:8002/health/ready
      - run: docker compose --profile ai down -v
        if: always()
